<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" aria-label="Scientific Calculator">
    <section class="calculator-panel">
      <div class="toolbar">
        <button id="modeBtn" class="mode-btn">Standard</button>
        <button id="graphBtn" class="graph-btn">Graph</button>
      </div>

      <input id="display" class="display" type="text" value="0" aria-label="Calculator display" readonly>

      <div class="buttons" id="standardButtons">
        <button class="function" data-action="clear">AC</button>
        <button class="function" data-action="delete">DEL</button>
        <button class="operator" data-value="/">÷</button>
        <button class="operator" data-value="*">×</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-value="-">−</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-value="+">+</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="equals" data-action="calculate">=</button>

        <button class="zero" data-value="0">0</button>
        <button data-value=".">.</button>
      </div>

      <div class="buttons scientific-buttons" id="scientificButtons" style="display: none;">
        <button class="function" data-action="clear">AC</button>
        <button class="function" data-action="delete">DEL</button>
        <button class="operator" data-value="/">÷</button>
        <button class="operator" data-value="*">×</button>

        <button class="scientific" data-action="sin">sin</button>
        <button class="scientific" data-action="cos">cos</button>
        <button class="scientific" data-action="tan">tan</button>
        <button class="operator" data-value="-">−</button>

        <button class="scientific" data-action="sqrt">√</button>
        <button class="scientific" data-action="power">x²</button>
        <button class="scientific" data-action="power3">x³</button>
        <button class="operator" data-value="+">+</button>

        <button class="scientific" data-action="ln">ln</button>
        <button class="scientific" data-action="log">log</button>
        <button class="scientific" data-action="factorial">!</button>
        <button class="equals" data-action="calculate">=</button>

        <button class="scientific" data-action="pi">π</button>
        <button class="scientific" data-action="e">e</button>
        <button class="scientific" data-action="openParen">(</button>
        <button class="scientific" data-action="closeParen">)</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="scientific" data-action="inverse">1/x</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button data-value="0">0</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button data-value=".">.</button>
      </div>
    </section>

    <section id="graphPanel" class="graph-panel hidden" aria-label="Function graph panel">
      <div class="graph-controls">
        <label for="graphInput">f(x) =</label>
        <input id="graphInput" type="text" value="sin(x)" aria-label="Function input for graphing">
        <button id="plotBtn" class="plot-btn">Plot</button>
      </div>
      <canvas id="graphCanvas" width="420" height="260" aria-label="Graph output"></canvas>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
